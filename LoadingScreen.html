<!-- ─────────────────────────────────────────────────────────────────────────
     Pantalla de carga — globo de aviación.

     Origen: gobernanza/ideas/mapamundi/loading-screen-aviacion.html, un bundle
     autoextraíble del editor de canvas. Ese fichero pesa 1 MB porque lleva
     dentro React 18.3.1, ReactDOM y @babel/standalone (3,06 MB en crudo) para
     compilar JSX en el navegador, más 54 KB del runtime del editor. La
     animación de verdad son 294 líneas: matemática pura y un solo <svg>.
     Nada de eso es dato — no hay coordenadas de mapa externas, ni imágenes
     base64, ni fuentes. La costa son 12 polilíneas escritas a mano, aquí abajo.

     Así que esto es el port a JS plano de esas 294 líneas: mismas constantes,
     misma geometría, mismos easings. Sin React, sin Babel, sin el engine.

     Tres diferencias deliberadas con el original, y el motivo de cada una:

     1. El original reproduce una línea de tiempo fija de 9,5 s en bucle. Aquí
        el bucle es de 7,0 s — las dos vueltas del avión, exactamente dos
        periodos de `lap`, que es donde el original puso la costura — y la
        escena de «Zoom final» NO forma parte del bucle: la dispara done(),
        cuando la app ya sabe qué pantalla enseñar. Una carga que dura lo que
        dura la carga, no lo que dura la animación.
     2. Por lo mismo, la variable `u` del original (`ramp(T, zStart, tot)`, el
        empujón final) no sale de T sino del reloj de salida. Todo lo que
        colgaba de ella — el zoom, el frenado del globo, el desvanecido del
        texto — cuelga ahora de la salida.
     3. El porcentaje del original se recalcula contra T, así que en bucle
        volvería a 000% cada 7 s. Aquí va contra el tiempo total transcurrido,
        tope 99 mientras se espera, y sube a 100 en la salida. Sigue siendo
        decorativo: no mide nada. Si algún día tiene que medir, los hitos son
        _shimConfigReady, apiGetAppBootstrap y el primer render.

     Se desmonta desde showScreen() en Scripts.html, que es el único punto donde
     la app decide qué pantalla enseña — app, pending o login. Y lleva techo
     propio por si ese punto no llega nunca: si los scripts no parsean, nadie
     llamará a nadie, y un globo girando para siempre es peor que un formulario.
────────────────────────────────────────────────────────────────────────── -->

<script>
(function () {
  var host = document.getElementById('aeroLoadingScreen');
  var stage = document.getElementById('aeroLsStage');
  var elMarca = document.getElementById('aeroLsMarca');
  if (!host || !stage || !elMarca) return;

  /* ── lo que el original recibía por atributos de <x-import> ────────────── */
  var GLOW = '#ffffff';
  var GS = 0.35;            // glow-strength
  var NSTARS = 150;         // starCount por defecto
  var LABEL = 'Loading';

  /* ── el reloj de salida ───────────────────────────────────────────────── */

  var W = 1920, H = 1080;
  var CX = 960, CY = 452, R = 208;

  var Ease = {
    easeInQuad:    function (t) { return t * t; },
    easeOutQuad:   function (t) { return t * (2 - t); },
    easeOutCubic:  function (t) { return 1 - Math.pow(1 - t, 3); },

    ramp:   function (v, a, b, ease) {

  };

  /* ---------- geometry ---------- */
  function sp(lon, lat) {
    var la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
    return { x: Math.cos(la) * Math.sin(lo), y: Math.sin(la), z: Math.cos(la) * Math.cos(lo) };
  }
  // Chaikin corner cutting — turns the hand-placed coast vertices into a
  // smooth continuous coastline instead of a chain of straight facets.
  function chaikin(pts, iters) {
    var p = pts;
    for (var it = 0; it < iters; it++) {
      var out = [];
      for (var i = 0; i < p.length; i++) {
        var a = p[i], b = p[(i + 1) % p.length];
        out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
        out.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }

  }

    for (var i = 0; i < list.length - 1; i++) {

      for (var k = 0; k < n; k++) {

        out.push(sp(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t));

    }
    var e = list[list.length - 1];
    out.push(sp(e[0], e[1]));

    /* British Isles */[[-5, 50], [-1, 51], [1, 52], [0, 54], [-2, 56], [-3, 58], [-5, 58], [-6, 56], [-5, 54], [-4, 53], [-5, 51]],
    /* Ireland */[[-10, 52], [-6, 53], [-6, 55], [-10, 54]],
    /* Sumatra */[[95, 5], [100, 1], [104, -2], [106, -6], [103, -5], [99, -1], [96, 3]],
    /* Borneo */[[109, 2], [113, 4], [117, 4], [119, 0], [117, -3], [111, -3], [109, -1]],

  function r1(n) { return Math.round(n * 10) / 10; }

  // Projects a sampled point list under globe rotation and emits only the
  // runs on the requested hemisphere — this is what hides the back side.
  function runs(pts, cr, sr, front) {
    var out = [], cur = '';
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var x = p.x * cr + p.z * sr, z = p.z * cr - p.x * sr, y = p.y;
      if ((y * ST + z * CT >= 0) === !!front) {
        cur += (cur ? 'L' : 'M') + r1(CX + R * x) + ' ' + r1(CY - R * (y * CT - z * ST));
      } else if (cur) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out.join(' ');
  }

  function orbitAt(th) {
    var ct = Math.cos(th), st = Math.sin(th);
    var x = ORB * ct * CI, y = ORB * ct * SI, z = ORB * st;
    var yv = y * CT - z * ST;
    return { sx: CX + R * x, sy: CY - R * yv, d: y * ST + z * CT, rad: Math.hypot(x, yv) };
  }

  var ORBIT = [];
  for (var i = 0; i <= 260; i++) ORBIT.push(orbitAt(TAU * i / 260));

  function orbitRuns(front) {
    var out = [], cur = '';
    for (var i = 0; i < ORBIT.length; i++) {
      var p = ORBIT[i];
      var vis = front ? p.d >= 0 : (p.d < 0 && p.rad > 1.02);
      if (vis) cur += (cur ? 'L' : 'M') + r1(p.sx) + ' ' + r1(p.sy);
      else if (cur) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out.join(' ');
  }
  var ORBIT_FRONT = orbitRuns(true), ORBIT_BACK = orbitRuns(false);

  function seen(p) {
    if (p.d >= 0) return 1;
    return 0.06 + 0.94 * MOTION.ramp(p.rad, 0.94, 1.16);
  }

  var PLANE = 'M19 0 L7 -2.4 L-1 -2.9 L-8 -14 L-11.6 -14 L-6.6 -2.9 L-12.4 -2.7 L-16.4 -8.4 L-19 -8.4 L-17.4 -2.2 L-20.4 0 L-17.4 2.2 L-19 8.4 L-16.4 8.4 L-12.4 2.7 L-6.6 2.9 L-11.6 14 L-8 14 L-1 2.9 L7 2.4 Z';

  function stars(n) {
    var s = 20260915, out = [];
    function rnd() { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; }

  var atmo = el('circle', { cx: CX, cy: CY, r: R * 2.1, fill: 'url(#aeroLsAtmo)' });

    var s = document.createElement('span');
    s.appendChild(document.createTextNode('.'));
    elLabel.appendChild(s);
    return s;
  });
  stage.appendChild(elLabel);

  var elPct = document.createElement('div');
  elPct.className = 'aero-ls-txt aero-ls-pct';
  elPct.style.top = r1(CY + R * 1.62 + 74) + 'px';
  elPct.style.textShadow = '0 0 ' + r1(12 * GS) + 'px ' + GLOW;
  var pctText = document.createTextNode('000%');
  elPct.appendChild(pctText);
  stage.appendChild(elPct);

  /* ---------- encaje en la ventana ----------
     El original vive dentro de un Stage de 1920x1080 que el editor escala. Hay
     que reproducirlo porque los dos textos se posicionan en píxeles de ESE
     espacio, no del viewBox: sin el escalado, en un móvil el globo mide 42 px
     de radio y el texto se queda donde estaba. */
  function fit() {
    var cubrir = Math.max(window.innerWidth / W, window.innerHeight / H);
    /* Cubrir del todo tiene un tope, y lo pone la marca.
       En una pantalla muy apaisada -- 21:9 y mas -- cubrir a lo ancho recorta
       por arriba y por abajo, y lo primero que se pierde es el emblema, que es
       lo mas alto que hay dibujado (y=56). El tope garantiza que la banda
       y=40..1040 se ve entera. Pasado el tope el escenario deja de llegar a los
       bordes laterales, y no se nota- lo que falta es cielo negro sobre un
       fondo que ya es negro. */
    var tope = window.innerHeight / 1000;
    var s = Math.min(cubrir, tope);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  /* ---------- el fotograma ---------- */
  function draw(elapsed, u) {
    var T = elapsed % ZSTART;

    var pulse = MOTION.breath(T, LAP, 0.22);
    var zoom = (1.004 + 0.018 * (1 - MOTION.breath(T, ZSTART, 2)) / 2) * (1 + 2.3 * Ease.easeInQuad(u));
    var driftX = 6 * Math.sin(TAU * T / ZSTART), driftY = 4 * Math.sin(TAU * T / ZSTART + 1);
    var fade = Math.min(MOTION.ramp(elapsed, 0, 0.35, Ease.easeOutQuad),
                        1 - MOTION.ramp(u, 0.55, 1, Ease.easeInQuad));

    // globe: one slow turn per loading loop, easing to a stop on the final
    // push so it settles facing the Atlantic — where the map screen opens
    var rotT = (u > 0 ? rotFrozen : T) + 0.34 * Ease.easeOutCubic(u);
    var rot = TAU * rotT / (LAP * 2), cr = Math.cos(rot), sr = Math.sin(rot);

    for (var i = 0; i < GRID.length; i++) {
      gridFEls[i].setAttribute('d', runs(GRID[i], cr, sr, true));
      gridBEls[i].setAttribute('d', runs(GRID[i], cr, sr, false));
    }
    for (var j = 0; j < LAND.length; j++) {
      landEls[j].setAttribute('d', runs(LAND[j], cr, sr, true));
    }

    // plane + trail
    var th = TAU * T / LAP - Math.PI * 0.85;
    var p0 = orbitAt(th), p1 = orbitAt(th + 0.012);
    var head = Math.atan2(p1.sy - p0.sy, p1.sx - p0.sx) * 180 / Math.PI;
    var pv = seen(p0);
    var pScale = 1.35 * (0.9 + 0.2 * MOTION.ramp(p0.d, -ORB, ORB));

    var span = TAU * 0.22, prev = p0;
    for (var t = 1; t <= TRAIL; t++) {
      var q = orbitAt(th - span * t / TRAIL);
      var f = Math.pow(1 - t / TRAIL, 1.5);
      var mid = orbitAt(th - span * (t - 0.5) / TRAIL);
      var seg = trailEls[t - 1];
      seg.setAttribute('d', 'M' + r1(prev.sx) + ' ' + r1(prev.sy) + 'L' + r1(q.sx) + ' ' + r1(q.sy));
      seg.setAttribute('stroke-width', 0.8 + 3.4 * f);
      seg.setAttribute('opacity', f * 0.95 * seen(mid));
      prev = q;
    }

    gPlane.setAttribute('transform', 'translate(' + r1(p0.sx) + ' ' + r1(p0.sy) + ') rotate(' + r1(head) + ') scale(' + r1(pScale * 100) / 100 + ')');
    gPlane.setAttribute('opacity', pv);
    planePath.setAttribute('fill-opacity', p0.d >= 0 ? 0.6 : 0);

    // estrellas
    for (var n = 0; n < starEls.length; n++) {
      var s = STARS[n];
      var tw = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(TAU * (s.k * T / (LAP * 2) + s.ph)));
      starEls[n].setAttribute('opacity', r1(s.b * tw * 100) / 100);
    }
    gStars.setAttribute('opacity', pulse);
    gStars.setAttribute('transform', 'translate(' + CX + ' ' + CY + ') scale(' + r1((1 + 0.35 * (zoom - 1)) * 1000) / 1000 + ') translate(' + -CX + ' ' + -CY + ')');

    gScene.setAttribute('transform', 'translate(' + r1(driftX) + ' ' + r1(driftY) + ') translate(' + CX + ' ' + CY + ') scale(' + r1(zoom * 1000) / 1000 + ') translate(' + -CX + ' ' + -CY + ')');
    atmo.setAttribute('opacity', pulse * GS);
    glow10.setAttribute('opacity', Math.min(1, 0.88 * GS * pulse));
    glow3.setAttribute('opacity', Math.min(1, 0.5 * GS * pulse));

    host.style.opacity = fade;

    // los puntos suspensivos
    var dotV = MOTION.cycle(T, 1.4) * 4;
    for (var d = 0; d < 3; d++) {
      dotEls[d].style.opacity = 0.16 + 0.84 * Math.max(0, Math.min(1, Math.min(dotV - d, 3.9 - dotV)));
    }

    // el porcentaje: monótono contra el tiempo total, tope 99 hasta la salida
    var pct;
    if (u > 0) {
      pct = pctFrozen + (100 - pctFrozen) * Ease.easeOutQuad(Math.min(1, u / 0.6));
    } else {
      pct = pctAt(elapsed);
      pctFrozen = pct;
    }
    pctText.nodeValue = String(Math.round(pct)).padStart(3, '0') + '%';

    // La marca se va con el texto, no con el fondo- si se quedase opaca mientras
    // el globo se acerca, seria lo unico quieto de la escena.
    elMarca.style.opacity = 1 - MOTION.ramp(u, 0.10, 0.50, Ease.easeInOutSine);
    elLabel.style.opacity = (0.72 + 0.28 * pulse) * (1 - MOTION.ramp(u, 0.10, 0.50, Ease.easeInOutSine));
    elPct.style.opacity   = (0.55 + 0.20 * pulse) * (1 - MOTION.ramp(u, 0.30, 0.70, Ease.easeInOutSine));
  }

  function pctAt(elapsed) {
    var pf = elapsed / (ZSTART + 0.16 * ZDUR), v = 0;
    for (var m = 0; m < PCT.length - 1; m++) {
      if (pf >= PCT[m][0] && pf <= PCT[m + 1][0]) {
        v = PCT[m][1] + (PCT[m + 1][1] - PCT[m][1]) * Ease.easeInOutSine(MOTION.ramp(pf, PCT[m][0], PCT[m + 1][0]));
        return Math.min(99, v);
      }
    }
    return 99;
  }

  /* ---------- el reloj ---------- */
  var now = (window.performance && performance.now) ? function () { return performance.now(); } : function () { return Date.now(); };
  var t0 = now();
  var exitAt = null, rotFrozen = 0, pctFrozen = 0;
  var gone = false, pending = false;
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function remove() {
    if (gone) return;
    gone = true;
    try { window.removeEventListener('resize', fit); } catch (e) {}
    if (host.parentNode) host.parentNode.removeChild(host);
  }

  function beginExit() {
    if (gone || exitAt !== null) return;
    exitAt = now();
    rotFrozen = ((exitAt - t0) / 1000) % ZSTART;
    // Un rAF parado — pestaña en segundo plano — no llega nunca al final del
    // fundido, y la pantalla de carga se quedaría puesta al volver. El reloj
    // de pared la quita pase lo que pase.
    setTimeout(remove, EXIT_MS + 400);
    if (reduced) {
      host.style.transition = 'opacity 350ms ease';
      host.style.opacity = '0';
      return;
    }
    if (!raf) raf = requestAnimationFrame(frame);
  }

  /* Que la app haya ELEGIDO pantalla no es que la pantalla este LISTA.
     Es la primera version de esto y estaba mal- showScreen('appScreen') se llama
     en cuanto la sesion se restaura de cache, y renderHome pinta entonces un
     armazon con tres huecos -- el mapa, el reto del dia y los modulos -- que
     tardan lo suyo en llegar. El globo se iba en ese instante y dejaba al
     estudiante delante de un avioncito girando y un "Loading your levels...",
     que es exactamente la espera que venia a tapar, solo que mas fea.

     Asi que el destino decide que se espera-

       - login o pending son definitivos- esa pantalla ya esta entera.
       - appScreen no lo es- ahi se espera a que el area de contenido deje de
         estar cargando.

     La lista de clases se ENUMERA, y hay que saber lo que eso cuesta- si algun
     dia aparece un cuarto tipo de hueco de carga y no se anade aqui, este codigo
     lo leera como contenido y el globo volvera a irse antes de tiempo. El techo
     de CEIL_MS es lo que acota el otro lado- si un hueco no se rellena nunca, la
     pantalla de carga se va igual en vez de quedarse para siempre.

     OJO- _isMidActivity(), en Scripts.html, mantiene una lista parecida para
     decidir otra cosa (si el estudiante esta a mitad de algo). NO es la misma
     pregunta, pero hoy le falta .pl-wrap, que se anadio despues. No se toca
     desde aqui- va como ticket aparte. */
  var HUECOS_DE_CARGA = '.pl-wrap, .app-spinner-wrap, .skeleton-card, ' +
                        '.completion-loading-shell, .boot-placeholder';
  var espera = null;

  function contenidoListo() {
    var area = document.getElementById('contentArea');
    if (!area) return true;                 // no hay nada que esperar

    /* Si el area no se VE, no se puede concluir que este lista.
       El enganche corre dentro de showScreen ANTES de que reparta la clase
       `active`, asi que en ese instante #appScreen sigue oculto y todo lo de
       dentro mide cero. Preguntar ahi devolvia "no hay ningun hueco visible" --
       cierto, y sin ningun significado -- y el globo se iba a los 1,6 s dejando
       detras las tres secciones cargando. La respuesta correcta cuando no se
       puede mirar es "todavia no", no "ya esta". */
    if (!area.getClientRects().length) return false;
    if (!area.children.length) return false; // aun sin pintar
    var huecos = area.querySelectorAll(HUECOS_DE_CARGA);
    for (var i = 0; i < huecos.length; i++) {
      /* Un hueco que no se VE ya no hace esperar a nadie.
         Las dos secciones que pueden fallar -- el reto del dia y los modulos --
         se esconden con display:none y dejan su .pl-wrap dentro del DOM. Mirar
         solo si el nodo existe dejaba el globo puesto hasta el techo de 15 s
         justo el dia que el servidor no contesta, que es cuando menos falta
         hace. getClientRects() sale vacio con display:none, propio o heredado. */
      if (huecos[i].getClientRects().length) return false;
    }
    return true;
  }

  function salir() {
    setTimeout(beginExit, Math.max(0, MIN_MS - (now() - t0)));
  }

  function done(pantalla) {
    if (gone || exitAt !== null) return;

    if (pantalla === 'appScreen') {
      if (espera) return;                   // ya se esta esperando
      pending = true;
      if (contenidoListo()) { salir(); return; }
      espera = setInterval(function () {
        if (gone || exitAt !== null || contenidoListo()) {
          clearInterval(espera); espera = null;
          if (!gone && exitAt === null) salir();
        }
      }, 120);
      return;
    }

    // login, pending, o el techo- la decision ya no va a cambiar
    if (espera) { clearInterval(espera); espera = null; }
    pending = true;
    salir();
  }

  var raf = null;
  function frame() {
    raf = null;
    if (gone) return;
    var elapsed = (now() - t0) / 1000;
    var u = exitAt === null ? 0 : Math.min(1, (now() - exitAt) / EXIT_MS);
    draw(elapsed, u);
    if (u >= 1) { remove(); return; }
    raf = requestAnimationFrame(frame);
  }

  if (reduced) {
    // Un globo girando a pantalla completa es mucho movimiento. Con la
    // preferencia puesta se dibuja un fotograma y se queda quieto.
    draw(1.2, 0);
  } else {
    raf = requestAnimationFrame(frame);
  }

  setTimeout(done, CEIL_MS);

  window.__aeroLoadingScreen = { done: done, remove: remove };
}());
</script>

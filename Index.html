  <script>
    // On Vercel: wait for shim to load APP_CONFIG before booting the app.
    // On GAS: _shimConfigReady is undefined so this block is skipped.
    if (window._shimConfigReady) {
      window._shimConfigReady.then(function() {
        if (typeof window.bootApp === 'function') window.bootApp();
      });
    }
    // Stale-code detector: if new XP functions aren't exposed on window, the
    // browser is running a cached old version of Scripts.html. Reload once.
    (function() {
      var ok = typeof window._getTierFromXp === 'function' && Array.isArray(window.GAM_TIERS);
      if (!ok) {
        var flag = '_aero_v318_reloaded';
        if (!sessionStorage.getItem(flag)) {
          sessionStorage.setItem(flag, '1');
          location.reload(true);
        }
      } else {
        sessionStorage.removeItem('_aero_v318_reloaded');
      }
    })();
    // Service worker — Vercel only (window._shimConfigReady is defined by shim.js)
    if (window._shimConfigReady && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function() {});
    }
  </script>
